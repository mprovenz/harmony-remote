# Flatpak manifest for Harmony Remote. Build + install for this user with: packaging/flatpak/build.sh
id: io.github.mprovenz.HarmonyRemote
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: harmony-remote

finish-args:
  # Hub control: WebSocket + HTTP to the hub on port 8088, the UDP discovery probe, and the TCP 5446 listener the
  # hub connects back to. Flatpak shares the host network namespace, so binding the port works.
  - --share=network
  # Avalonia 12 has no Wayland backend; it runs through XWayland. fallback-x11 would not grant X11 on a Wayland session.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Tray icon (StatusNotifierItem over D-Bus). Avalonia registers it as org.kde.StatusNotifierItem-<pid>-<n>; the
  # app is pid 2 inside the sandbox and has one icon, and own-name only takes ".*" wildcards, so the name is exact.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-0
  # Optional, read-only: which Plasma panel holds the system tray, to open the remote next to it (else top right).
  - --filesystem=xdg-config/plasma-org.kde.plasma.desktop-appletsrc:ro

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    AVALONIA_TELEMETRY_OPTOUT: '1'

modules:
  - name: harmony-remote
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .idea
          - tests
          - src/HarmonyRemote.App/bin
          - src/HarmonyRemote.App/obj
          - src/HarmonyRemote.Core/bin
          - src/HarmonyRemote.Core/obj
          # flatpak-builder's own folders when it runs from the repo root (the GitHub workflow does), and build.sh --bundle output
          - .flatpak-builder
          - flatpak_app
          - repo
          - harmony-remote.flatpak
      # Every NuGet package the restore needs, fetched by flatpak-builder (builds run offline).
      # Regenerate after changing package references: packaging/flatpak/build.sh --sources
      - nuget-sources.json
    build-commands:
      - |
        case "$FLATPAK_ARCH" in
          x86_64) rid=linux-x64 ;;
          aarch64) rid=linux-arm64 ;;
          *) echo "unsupported arch $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        # Self-contained: the Platform runtime has no .NET.
        dotnet publish src/HarmonyRemote.App/HarmonyRemote.App.csproj -c Release -r "$rid" --self-contained true \
          --source ./nuget-sources -p:DebugType=none -o /app/lib/harmony-remote
      - mkdir -p /app/bin && ln -s /app/lib/harmony-remote/harmony-remote /app/bin/harmony-remote
      - install -Dm644 packaging/flatpak/io.github.mprovenz.HarmonyRemote.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.mprovenz.HarmonyRemote.metainfo.xml -t /app/share/metainfo
      - install -Dm644 src/HarmonyRemote.App/Assets/app-256.png /app/share/icons/hicolor/256x256/apps/io.github.mprovenz.HarmonyRemote.png
